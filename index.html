<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animated Glow Buttons</title>

    <!-- Bootstrap Icons + Inter font -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="grid">
      <button class="gbtn b1">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>
      <button class="gbtn b8 icon-grad">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>

      <button class="gbtn b2">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>
      <button class="gbtn b7 icon-grad">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>

      <button class="gbtn b3 icon-grad">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>
      <button class="gbtn b10">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>

      <button class="gbtn b4 icon-grad">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>
      <button class="gbtn b11 icon-grad">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>

      <button class="gbtn b5">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>
      <button class="gbtn b12 icon-grad">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>

      <button class="gbtn b6">
        <svg aria-hidden="true"><rect></rect></svg>
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>
      <button class="gbtn b13">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>

      <button class="gbtn b9 icon-grad">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>
      <button class="gbtn b14 icon-grad">
        <span class="label">Get Started</span><i class="bi bi-send-fill"></i>
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
